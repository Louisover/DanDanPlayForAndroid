name: package beta

on:
  push:
    branches:
      - test
  workflow_dispatch:

# 关键：给 GITHUB_TOKEN 写权限，才能创建 Release
permissions:
  contents: write

jobs:
  package:
    name: Generate Beta APK
    runs-on: ubuntu-latest
    steps:
      - name: checkout source code
        uses: actions/checkout@v4

      - name: set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: 11
          distribution: temurin

      - name: setup debug keystore
        run: |
          cp gradle/assemble/debug.jks gradle/assemble/dandanplay.jks
          echo "已使用 debug.jks 作为签名文件"

      - name: setup build type
        run: echo "BUILD_TYPE=beta" >> $GITHUB_ENV

      - name: assemble apk
        env:
          KEYSTORE_PASS: "123456"
          ALIAS_NAME: "debug"
          ALIAS_PASS: "123456"
        run: |
          chmod +x gradlew
          ./gradlew clean assemble${{ env.BUILD_TYPE }} --stacktrace

      - name: setup build version
        run: |
          apk_version=$(egrep -o "[0-9]+\.[0-9]+\.[0-9]+" buildSrc/src/main/java/Versions.kt | head -1)
          echo "BUILD_VERSION=$apk_version" >> $GITHUB_ENV
          echo "版本号: $apk_version"

      - name: move file
        run: |
          abis=(arm64-v8a armeabi-v7a universal)
          for abi in ${abis[@]}
          do
            file_name="dandanplay_v${{ env.BUILD_VERSION }}_${abi}-${{ env.BUILD_TYPE }}.apk"
            src="app/build/outputs/apk/${{ env.BUILD_TYPE }}/${file_name}"
            if [ -f "$src" ]; then
              mv "$src" "$file_name"
              echo "已移动: $file_name"
            else
              echo "警告: 找不到 $src"
              find app/build/outputs/apk -name "*.apk" -type f
            fi
          done

      - name: generate release
        uses: softprops/action-gh-release@v2
        with:
          name: 弹弹play概念版 v${{ env.BUILD_VERSION }} Beta (test)
          tag_name: dandanplay-v${{ env.BUILD_VERSION }}-beta-test
          body: |
            最新测试包（来自 test 分支）
            - 使用 debug 签名，可直接安装测试
            - 与 test 分支代码同步
          prerelease: true
          files: |
            dandanplay_v${{ env.BUILD_VERSION }}_arm64-v8a-${{ env.BUILD_TYPE }}.apk
            dandanplay_v${{ env.BUILD_VERSION }}_armeabi-v7a-${{ env.BUILD_TYPE }}.apk
            dandanplay_v${{ env.BUILD_VERSION }}_universal-${{ env.BUILD_TYPE }}.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
